<!doctype html>
<html lang="en">

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"

    <meta
      name="author"
      content="Next Steel Innovation"
    />

    <meta
      name="theme-color"
      content="#1261C9"

    <!-- Open Graph -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="Next Steel Innovation | Steel Storage & Kitchen Organizers"
    />

    <meta
      property="og:description"
      content="Shop steel storage, kitchen organizers, shoe racks, trolleys, shelves and everyday utility products from Next Steel Innovation."
    />

    <meta
      property="og:image"
      content="/images/Logo.png"
    />

    <meta
      property="og:site_name"
      content="Next Steel Innovation"
    />

    <!-- Twitter -->

    <meta
      name="twitter:card"
      content="summary"
    />

    <meta
      name="twitter:title"
      content="Next Steel Innovation | Steel Storage & Kitchen Organizers"
    />

    <meta
      name="twitter:description"
      content="Steel storage, kitchen organizers, shoe racks, trolleys, shelves and utility products from Next Steel Innovation."
    />

    <meta
      name="twitter:image"
      content="/images/Logo.png"
    />

    <!-- Bootstrap Icons -->

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />

    <!-- Google Font -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />

      rel="preconnect"

    <link

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "Next Steel Innovation",
            "logo": "/images/Logo.png"
          },
          {
            "@type": "WebSite",
            "name": "Next Steel Innovation",
            "description": "Steel storage, kitchen organizers and home utility products."
          }
        ]
      }
